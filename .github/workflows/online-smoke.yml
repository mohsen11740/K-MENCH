name: K-MENCH Online Multiplayer Test
on:
  push:
    branches: [main]
    paths:
      - "scripts/smoke-online.mjs"
      - ".github/workflows/online-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test two-player online room and synchronized move
        run: node scripts/smoke-online.mjs
