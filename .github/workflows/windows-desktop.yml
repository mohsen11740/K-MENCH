name: Build Windows Desktop
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'electron/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Create Windows icon from BM logo
        shell: pwsh
        run: |
          npm install --no-save sharp png-to-ico
          New-Item -ItemType Directory -Force build | Out-Null
          node --input-type=module -e "import sharp from 'sharp'; import pngToIco from 'png-to-ico'; import { writeFile } from 'node:fs/promises'; const png = await sharp('assets/logo.svg').resize(256,256).png().toBuffer(); await writeFile('build/icon.ico', await pngToIco(png));"
      - name: Build Windows portable EXE
        run: npm run desktop:build
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: BM-baran-mench-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
